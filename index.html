<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMR Hany</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      font-family: 'Cairo', sans-serif;
    }

    /* خلفية متدرجة ديناميكية مميزة */
    body {
      background: radial-gradient(circle at center, #2a0845 0%, #11001c 70%, #05000a 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* كارت زجاجي شفاف نيون Glassmorphism */
    .neon-card {
      background: rgba(20, 10, 35, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 0, 128, 0.4);
      box-shadow: 
        0 0 30px rgba(255, 0, 128, 0.3),
        0 0 60px rgba(0, 246, 255, 0.15),
        inset 0 0 20px rgba(255, 230, 0, 0.1);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .neon-card:hover {
      border-color: rgba(0, 246, 255, 0.8);
      box-shadow: 
        0 0 50px rgba(0, 246, 255, 0.5),
        0 0 90px rgba(255, 0, 128, 0.3),
        inset 0 0 30px rgba(255, 0, 128, 0.2);
    }

    /* تصميم وتأثيرات الصورة النيون */
    .avatar-wrapper {
      position: relative;
    }

    .avatar-wrapper::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      background: linear-gradient(45deg, #ff007f, #00f6ff, #ffe600, #ff007f);
      background-size: 300% 300%;
      animation: rotateGlow 6s linear infinite;
      z-index: 0;
      filter: blur(8px);
    }

    .avatar-img {
      position: relative;
      z-index: 1;
      border: 4px solid #11001c;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.08) rotate(-3deg);
      filter: brightness(1.15) contrast(1.1);
    }

    /* زر النيون الأسطوري الفاقع */
    .crazy-neon-btn {
      position: relative;
      background: linear-gradient(90deg, #ff007f, #9d00ff, #00f6ff, #ffe600, #ff007f);
      background-size: 400% 400%;
      animation: gradientShift 5s ease infinite;
      border: none;
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.5);
      box-shadow: 
        0 0 20px rgba(255, 0, 128, 0.6),
        0 0 40px rgba(0, 246, 255, 0.4);
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .crazy-neon-btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: rgba(255, 255, 255, 0.2);
      transform: rotate(30deg) translateY(-100%);
      transition: transform 0.6s ease;
    }

    .crazy-neon-btn:hover::after {
      transform: rotate(30deg) translateY(100%);
    }

    .crazy-neon-btn:hover {
      transform: translateY(-4px) scale(1.05);
      box-shadow: 
        0 0 35px rgba(255, 0, 128, 0.9),
        0 0 70px rgba(0, 246, 255, 0.7),
        0 0 100px rgba(255, 230, 0, 0.5);
    }

    .crazy-neon-btn:active {
      transform: translateY(2px) scale(0.98);
      box-shadow: 0 0 15px rgba(255, 0, 128, 0.8);
    }

    /* حركات الأنيميشن Keyframes */
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes rotateGlow {
      0% { background-position: 0% 50%; transform: rotate(0deg); }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; transform: rotate(360deg); }
    }

    /* تأثير نبض الخلفية Dynamic Canvas Background */
    #particle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
  </style>
</head>
<body class="flex items-center justify-center relative min-h-screen p-4 select-none">

  <!-- خلفية الجسيمات المضيئة -->
  <canvas id="particle-canvas"></canvas>

  <!-- الكارت الرئيسي في سنتر الصفحة -->
  <main class="relative z-10 neon-card rounded-3xl p-8 sm:p-12 max-w-md w-full text-center flex flex-col items-center justify-center gap-6 my-auto">
    
    <!-- 1. الصورة فوق البوتون بدون source -->
    <div class="avatar-wrapper mt-2">
      <img 
        id="avatar"
        src="amrshe7ta.jpeg" 
        alt="Neon Avatar" 
        class="avatar-img w-36 h-36 sm:w-44 sm:h-44 rounded-full object-cover shadow-2xl bg-purple-950/50"
      >
    </div>

    <!-- 2. البوتون الفاقع تحت الصورة -->
    <button 
      id="neonBtn"
      onclick="window.location.href='https://ipn.eg/S/amr_basha01/instapay/5Yhtbp'"
      class="crazy-neon-btn w-full py-4 px-8 rounded-2xl text-lg sm:text-xl font-black flex items-center justify-center gap-3 tracking-wide cursor-pointer my-2"
    >
      <i class="fa-solid fa-wand-magic-sparkles text-yellow-300 text-2xl"></i>
      <span> اضغط لاشباع عمور😭</span>
      <i class="fa-solid fa-arrow-left text-cyan-200"></i>
    </button>

  </main>

  <!-- كود الجافاسكربت الخاص بانفجار الألوان عند الضغط -->
  <script>
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const colors = ['#ff007f', '#00f6ff', '#ffe600', '#9d00ff'];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, isBurst = false) {
        this.x = x || Math.random() * canvas.width;
        this.y = y || Math.random() * canvas.height;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.size = isBurst ? Math.random() * 6 + 2 : Math.random() * 3 + 1;
        this.speedX = isBurst ? (Math.random() - 0.5) * 12 : (Math.random() - 0.5) * 1.5;
        this.speedY = isBurst ? (Math.random() - 0.5) * 12 : (Math.random() - 0.5) * 1.5;
        this.life = isBurst ? 1 : Math.random() * 0.8 + 0.2;
        this.decay = isBurst ? Math.random() * 0.03 + 0.015 : 0;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.decay > 0) {
          this.life -= this.decay;
        } else {
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.life);
        ctx.shadowBlur = 12;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 60; i++) {
      particles.push(new Particle());
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();

        if (particles[i].life <= 0) {
          particles.splice(i, 1);
        }
      }

      while (particles.length < 60) {
        particles.push(new Particle());
      }

      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    function triggerBurst(e) {
      const rect = e.target.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;

      for (let i = 0; i < 50; i++) {
        particles.push(new Particle(clickX, clickY, true));
      }
    }
  </script>
</body>
</html>
